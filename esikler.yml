# Nöbet eşikleri — bu dosyayı değiştirerek uyarı hassasiyetini ayarlarsın.
# Değişiklik sonrası repoya push etmen yeterli, koda dokunmaya gerek yok.

# Portföyünde olan coinler için varsayılan eşik (daha hassas — paran orada)
portfoy:
  degisim_yuzde: 7.0
  sessizlik_saat: 12

# Radarındaki (henüz almadığın) coinler için varsayılan eşik
radar:
  degisim_yuzde: 10.0
  sessizlik_saat: 12

# --- COIN BAZINDA EŞİK (varsayılanı ezer) ---
# Büyük coinler küçüklerden daha az oynar. BTC'ye %10 eşik koyarsan
# aylarca hiç bildirim almazsın. Buradaki değerler yüzde cinsinden.
coin_esikleri:
  # Buyuk coinler az oynar -> dusuk esik
  BTC: 5.0
  ETH: 6.0
  # Orta buyuklukte
  SOL: 8.0
  XRP: 8.0
  ADA: 9.0
  LINK: 9.0
  DOT: 9.0
  AVAX: 10.0
  ATOM: 10.0
  # Daha oynak, L2'ler -> yuksek esik yoksa surekli titrer
  ARB: 12.0
  OP: 12.0

# Piyasa geneli göstergeleri
piyasa:
  fear_greed_alt: 20        # bu değerin altı → "aşırı korku"
  fear_greed_ust: 80        # bu değerin üstü → "aşırı açgözlülük"
  sessizlik_saat: 24

# Nöbetin çalışacağı saat aralığı (TSİ). bitis HARİÇ.
# Hafta içi 18:00-21:00 saat başı, hafta sonu 09:00-21:00 iki saatte bir.
# Bu pencerelerin dışında nöbet koşsa bile mesaj atmaz.
calisma_saatleri:
  hafta_ici:
    baslangic: 18
    bitis: 22
  hafta_sonu:
    baslangic: 9
    bitis: 22

# Hangi yöndeki hareketler uyarı üretsin?
#   her_ikisi   → hem yükseliş hem düşüş
#   sadece_dusus → sadece düşüşler (yükselen coin bildirimi gelmez)
#   sadece_yukselis → sadece yükselişler
yon_filtresi: her_ikisi

# Kademe 2 (yorum katmanı) hangi modelle çalışsın
model:
  ad: claude-sonnet-5
  effort: medium

# Fiyatlar hangi para biriminde gösterilsin?
# Midas TL gösterdiği için ikisi birden açık.
para_birimleri: [usd, try]

# CoinGecko id'leri. portfoyum.csv ve radarim.md ile eşleşmeli.
# Tam liste: https://api.coingecko.com/api/v3/coins/list
coingecko_id_haritasi:
  BTC: bitcoin
  ETH: ethereum
  SOL: solana
  XRP: ripple
  AVAX: avalanche-2
  LINK: chainlink
  ADA: cardano
  DOGE: dogecoin
  DOT: polkadot
  ATOM: cosmos
  ARB: arbitrum
  OP: optimism
